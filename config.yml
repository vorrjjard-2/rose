vocab_size : 34        # character-level Shakespeare
n_ctx : 64
d_model : 256
n_heads : 8
n_layers : 6
dropout : 0.1
lr : 3e-4
possible_tokens : 'abcdefghijklmnopqrstuvwxyz,.?!":; '
init_range : 0.2
device : 'mps'

## training args
batch_size : 32
epochs : 50

## checkpointing
checkpoint_dir : 'checkpoints/'
save_model_every : 25