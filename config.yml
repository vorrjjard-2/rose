vocab_size : 65 # character-level Shakespeare
n_ctx : 128
d_model : 256
n_heads : 4
n_layers : 6
dropout : 0.2
lr : 1e-3
possible_tokens : "!$&',-.3:;?ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz "
init_range : 0.02
device : 'cuda'
## training args
batch_size : 128
epochs : 50

## checkpointing
checkpoint_dir : 'checkpoints/'
save_model_every : 10
